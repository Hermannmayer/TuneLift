name: Release

# 推 v* 标签时：完整跑一遍 lint / 测试 / 打包 / 冒烟测试，然后建一个只有说明的
# Release。刻意不发布编译产物——原因见下面「发布 Release」那一步的注释。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 校验可构建性并发布说明
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: pytest
        run: uv run --frozen pytest

      - name: 准备 ffmpeg.exe
        shell: pwsh
        run: ./scripts/fetch_ffmpeg.ps1

      - name: 打包
        run: ./build.bat

      - name: 冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & .\dist\TuneLift\main.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "main.exe --help 退出码 $LASTEXITCODE" }

          foreach ($name in 'TuneLift.exe', 'main.exe', 'tunelift.ico', '_internal',
                           'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md') {
            if (-not (Test-Path "dist\TuneLift\$name")) { throw "打包结果缺少 $name" }
          }
          if (-not (Test-Path 'dist\TuneLift\LICENSES\Qt-LGPL-3.0-only.txt')) {
            throw '打包结果缺少 Qt 的 LGPLv3 全文'
          }
          if (-not (Test-Path 'dist\TuneLift\LICENSES\FFmpeg-LGPL-3.0.txt')) {
            throw '打包结果缺少 FFmpeg 的 LGPLv3 全文'
          }

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 只发 release notes，源码压缩包由 GitHub 自动附带。
          #
          # 刻意不发布构建好的二进制：本项目的用途是转换用户自己合法购买的音频，
          # 直接分发一个现成可运行的成品，等于把「规避技术措施的装置」递到任何人手上，
          # 和只提供源码完全不是一个量级。需要的人请自行按 README 构建。
          generate_release_notes: true
          draft: false
