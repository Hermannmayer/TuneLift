name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff 格式检查
        run: uv run --frozen ruff format --check .

      - name: pytest
        run: uv run --frozen pytest

  windows-package:
    name: Windows 打包自检
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 准备 ffmpeg.exe
        shell: pwsh
        run: ./scripts/fetch_ffmpeg.ps1

      - name: 打包
        run: ./build.bat

      - name: 冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 打包出来的后端至少要能正常响应 --help
          & .\dist\TuneLift\main.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "main.exe --help 退出码 $LASTEXITCODE" }

          # GUI 按 exe 同级目录找图标，缺了窗口图标就会丢
          foreach ($name in 'TuneLift.exe', 'main.exe', 'tunelift.ico') {
            if (-not (Test-Path "dist\TuneLift\$name")) { throw "打包结果缺少 $name" }
          }
          if (-not (Test-Path 'dist\TuneLift\_internal')) { throw '打包结果缺少 _internal' }

      - name: 上传自检产物
        uses: actions/upload-artifact@v4
        with:
          name: TuneLift-win64-ci
          path: dist/TuneLift
          if-no-files-found: error
          retention-days: 7
